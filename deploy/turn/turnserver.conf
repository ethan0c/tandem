# Tandem's relay (coturn). setup.sh fills in __DOMAIN__ and __SECRET__ and installs this as
# /etc/turnserver.conf. Calls use it only when two people cannot connect directly.

# Short-lived passwords: the site (/api/turn) signs them with the same secret; nothing else gets in.
use-auth-secret
static-auth-secret=__SECRET__
realm=__DOMAIN__
server-name=__DOMAIN__
fingerprint

# Plain TURN on the standard port, and TURN over TLS on 443, which gets through school, office and
# hotel Wi-Fi that blocks everything but HTTPS.
listening-port=3478
tls-listening-port=443
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

# Relay ports. One per relayed person while a call is on; 1000 is plenty to start.
min-port=49152
max-port=50151

# Limits, so one person (or a stolen password) cannot use up the server: relayed sessions per
# username, in total, and about 4 Mbit/s per session (enough for a 720p share plus the call).
user-quota=12
total-quota=1200
max-bps=500000
stale-nonce=600

# Never relay into private networks: stops anyone using the relay to reach this server's own
# network or the cloud provider's internal services.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
simple-log
log-file=stdout
