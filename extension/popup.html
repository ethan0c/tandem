<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tandem</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <svg width="32" height="20" viewBox="0 0 64 40" fill="none" aria-hidden="true"><circle cx="21" cy="20" r="15" stroke="#7c3aed" stroke-width="7" /><circle cx="43" cy="20" r="15" stroke="#7c3aed" stroke-width="7" /></svg>
      <span>tandem</span>
    </header>

    <section id="unsupported" hidden>
      <p id="access-message" class="muted">Enable Tandem on this site to look for its video player. Compatibility varies by site.</p>
      <button id="enable" class="btn btn-brand">Enable on this site</button>
      <p id="access-error" class="error" role="alert" hidden></p>
    </section>

    <section id="active" hidden>
      <p class="label">In room</p>
      <div class="row">
        <code id="current"></code>
        <button id="copy" class="btn btn-light btn-sm">Copy invite</button>
      </div>
      <p id="player" class="muted"></p>
      <button id="leave" class="btn btn-danger">Leave room</button>
    </section>

    <p id="compatibility" class="muted" hidden>Streaming-site support is experimental. Both people need access to the same episode. Ads may interrupt sync.</p>

    <section id="idle" hidden>
      <button id="create" class="btn btn-brand">+ Create a room</button>
      <div class="or"><span>or join</span></div>
      <form id="join" class="row">
        <input id="code" placeholder="Paste a room link or code" autocomplete="off" />
        <button class="btn btn-dark btn-sm" type="submit">Join</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>

    <details>
      <summary>Settings</summary>
      <label>
        Tandem app URL
        <input id="origin" placeholder="https://www.ilovemygf.site" />
      </label>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
