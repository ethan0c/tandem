<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tandem</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" stroke="#8b5cf6" stroke-width="2.25" /><rect x="12" y="12" width="16" height="16" rx="5" stroke="#8b5cf6" stroke-width="2.25" /></svg>
      <span>tandem</span>
    </header>

    <section id="unsupported" hidden>
      <p id="access-message" class="muted">Turn on Tandem for this site to watch together. Some videos may not work yet.</p>
      <button id="enable" class="btn btn-brand">Enable on this site</button>
      <p id="access-error" class="error" role="alert" hidden></p>
    </section>

    <section id="active" hidden>
      <p class="label">In room</p>
      <div class="row">
        <code id="current"></code>
        <button id="copy" class="btn btn-light btn-sm">Copy invite</button>
      </div>
      <p id="player" class="muted"></p>
      <button id="leave" class="btn btn-danger">Leave room</button>
    </section>

    <p id="compatibility" class="muted" hidden>Some videos may not work yet. You both need access to the same episode. Ads can get you out of step.</p>

    <section id="idle" hidden>
      <button id="create" class="btn btn-brand">+ Create a room</button>
      <div class="or"><span>or join</span></div>
      <form id="join" class="row">
        <input id="code" placeholder="Paste a room link or code" autocomplete="off" />
        <button class="btn btn-dark btn-sm" type="submit">Join</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="ours" hidden>
      <p class="label">Our shows</p>
      <p id="stats" class="stats"></p>
      <ul id="shows"></ul>
      <button id="share-story" class="link" type="button" hidden>Share our story →</button>
    </section>

    <button id="plan" class="link" type="button">Plan a watch night →</button>

    <details>
      <summary>Settings</summary>
      <label>
        Tandem website address
        <input id="origin" placeholder="https://www.ilovemygf.site" />
      </label>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
